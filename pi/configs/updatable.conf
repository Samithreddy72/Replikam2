# NetBridge — files that can be replaced remotely by a SIGNED update (no reflash).
#
# Installed read-only at /etc/netbridge/updatable.conf. This list itself is NOT updatable:
# widening it needs a new image, so a stolen signing key still cannot reach anything else.
#
# How a signed update works (bridge-deploy-script.sh + bridge-overrides.sh):
#   fetch <name> + <name>.sig from the fleet -> verify against /etc/netbridge/script-pubkey.pem
#   (read-only root) -> type check (bash -n / python compile / ssh-keygen / unit syntax) ->
#   store in /data/overrides -> put it in place -> apply (column 4). Every boot re-verifies
#   every file before using it. A crash-looping service, three failed boots in a row, or a
#   bridge that stops reaching the fleet reverts to the built-in file automatically.
#
# Kinds (column 3)
#   loader   started through bridge-run.sh, which verifies and runs the override itself
#   bind     the verified file is bind-mounted over the built-in path (every caller sees it)
#   keys     like bind, but an SSH authorized_keys file (checked with ssh-keygen)
#   dropin   a systemd drop-in for the unit in column 5, written under /run/systemd/system
#
# Apply (column 4) — when a new file takes effect
#   restart  restart the unit(s) now (not in the media path; safe during a meeting)
#   idle     restart when no presenter video is flowing; until then it waits as "pending"
#   camera   restart when no video is flowing AND the meeting laptop is unplugged
#            (restarting the camera with a laptop attached hangs the USB controller and
#            reboots the Pi — measured 2/2 on 2026-09-24)
#   video    the video-feeder sequence: stop camera -> restart feeder -> start camera,
#            under the same conditions as camera (restarting the feeder alone while the
#            camera holds /dev/video40 crash-loops video — 2026-09-22)
#   boot     takes effect at the next reboot (USB descriptor, power trims)
#   none     takes effect the next time the program is run
#   agent    next agent tick; the lifeline guard reverts it if the fleet goes quiet
#   lifeline restart now; the lifeline guard reverts it if the fleet goes quiet
#
# Never updatable (not listed, on purpose): bridge-run.sh, bridge-deploy-script.sh,
# bridge-overrides.sh, bridge-cmd-run.sh, bridge-ab, bridge-pin, bridge-derive-pass,
# bridge-identity.sh, bridge-firstboot.sh — the loader, the installer, the rollback guard, the
# A/B switch and the security/provisioning tools. They change only with a new image (OTA).
#
# name                     target                                   kind    apply     units
bridge-feeder-net.sh       /usr/local/bin/bridge-feeder-net.sh      loader  video     bridge-feeder-net
bridge-feeder-audio.sh     /usr/local/bin/bridge-feeder-audio.sh    loader  idle      bridge-feeder-audio
bridge-return-audio.sh     /usr/local/bin/bridge-return-audio.sh    loader  idle      bridge-return-audio
