flight-recorder.py         /usr/local/bin/flight-recorder.py        bind    restart   flight-recorder
flight-recorder.sh         /usr/local/bin/flight-recorder.sh        bind    restart   flight-recorder
bridge-idle-frame.sh       /usr/local/bin/bridge-idle-frame.sh      bind    restart   bridge-idle-frame
render-idle-frame.py       /usr/local/bin/render-idle-frame.py      bind    restart   bridge-idle-frame
bridge-supervisor.sh       /usr/local/bin/bridge-supervisor.sh      bind    idle      bridge-supervisor
bridge-ssh.sh              /usr/local/bin/bridge-ssh.sh             bind    restart   bridge-ssh
wifi-guardian.sh           /usr/local/bin/wifi-guardian.sh          bind    lifeline  wifi-guardian
bridge-wifi-portal.sh      /usr/local/bin/bridge-wifi-portal.sh     bind    lifeline  bridge-wifi-portal
bridge-agent.py            /usr/local/bin/bridge-agent.py           bind    agent     -
bridge                     /usr/local/bin/bridge                    bind    none      -
bridge-wifi                /usr/local/bin/bridge-wifi               bind    none      -
bridge-jitter.py           /usr/local/bin/bridge-jitter.py          bind    none      -
bridge-golden.py           /usr/local/bin/bridge-golden.py          bind    none      -
bridge-read.py             /usr/local/bin/bridge-read.py            bind    none      -
bridge-diagnose.sh         /usr/local/bin/bridge-diagnose.sh        bind    none      -
bridge-status.sh           /usr/local/bin/bridge-status.sh          bind    none      -
bridge-watchdog.sh         /usr/local/bin/bridge-watchdog.sh        bind    none      -
bridge-update.sh           /usr/local/bin/bridge-update.sh          bind    none      -
bridge-clock-fft.py        /usr/local/bin/bridge-clock-fft.py       bind    none      -
bridge-soak.sh             /usr/local/bin/bridge-soak.sh            bind    none      -
bridge-wait.sh             /usr/local/bin/bridge-wait.sh            bind    none      -
bridge-up-all.sh           /usr/local/bin/bridge-up-all.sh          bind    none      -
bridge-feeder.sh           /usr/local/bin/bridge-feeder.sh          bind    none      -
bridge-crackle-sentry.sh   /usr/local/bin/bridge-crackle-sentry.sh  bind    none      -
bridge-pitch.py            /usr/local/bin/bridge-pitch.py           bind    none      -
owner_ssh_authorized_keys  /etc/netbridge/owner_ssh_authorized_keys keys    none      -
