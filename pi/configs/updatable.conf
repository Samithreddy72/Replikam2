dropin.bridge-feeder-audio bridge-feeder-audio                      dropin  idle      bridge-feeder-audio
dropin.bridge-return-audio bridge-return-audio                      dropin  idle      bridge-return-audio
dropin.bridge-uvcd         bridge-uvcd                              dropin  camera    bridge-uvcd
dropin.bridge-web          bridge-web                               dropin  restart   bridge-web
dropin.jitter-sentry       jitter-sentry                            dropin  restart   jitter-sentry
dropin.flight-recorder     flight-recorder                          dropin  restart   flight-recorder
dropin.bridge-supervisor   bridge-supervisor                        dropin  idle      bridge-supervisor
dropin.bridge-ssh          bridge-ssh                               dropin  restart   bridge-ssh
