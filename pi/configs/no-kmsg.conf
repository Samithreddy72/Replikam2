# Do not copy kernel messages into the journal.
#
# While a meeting laptop pulls video, the UVC gadget logs "uvc: VS request completed with status
# -61" for every missed isochronous slot - 14-16 lines a second on a busy bridge. journald spent
# 30-37% of a core ingesting, compressing and writing them (0.2-0.4% of a core without that storm),
# on a 900 MHz Pi that was already 83% busy: the missed slots cost CPU, which caused more missed
# slots (measured live 2026-09-22).
#
# Nothing on the bridge reads kernel lines from the journal: diagnostics use `dmesg`, which still
# holds them (current boot only). Every service's own log is unaffected.
[Journal]
ReadKMsg=no
