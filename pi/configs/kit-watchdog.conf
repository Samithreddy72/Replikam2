# Installed to /etc/systemd/system.conf.d/99-watchdog.conf
# Hardware watchdog (BCM2835, 15s max) armed: if systemd stops petting /dev/watchdog0
# the SoC hard-resets the Pi — so a kernel hang / freeze self-recovers with no human.
# RuntimeWatchdogSec was 0 historically after commit f370860 flagged a boot-with-client
# reboot spiral; that case was re-tested 2026-07-23 (client enumerated, armed at 15s,
# rebooted) and did NOT spiral, so 15s is validated. RebootWatchdogSec bounds a hung
# shutdown/reboot. If a spiral ever reappears, set RuntimeWatchdogSec=0 and reboot.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
