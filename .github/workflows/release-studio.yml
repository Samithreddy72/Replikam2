name: Release NetBridge Studio (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Studio version, for example 0.1.1 (no v prefix)'
        required: true
        type: string
      draft:
        description: 'Keep release as draft for signing/hardware review'
        type: boolean
        default: true
      macos_sign:
        description: 'Sign and notarize macOS (requires Apple secrets)'
        type: boolean
        default: false
      updater:
        description: 'Generate signed updater artifacts (requires updater secrets/variables)'
        type: boolean
        default: false
      persistent_audio:
        description: 'Bundle PyGObject for the persistent audio receiver (NB_PERSISTENT_AUDIO)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-studio-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  STUDIO_VERSION: ${{ inputs.version }}
  # package.mjs adds the Gst binding to the frozen engine; smoke-engine.py then requires
  # the packaged persistent receiver to pass its self-test.
  NB_PERSISTENT_AUDIO: ${{ inputs.persistent_audio && '1' || '0' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  validate:
    permissions:
      contents: write
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python app/netbridge-desktop/scripts/ci-release.py version --version "$STUDIO_VERSION"
          python - <<'PY'
          import json, os, subprocess
          tag = 'refs/tags/studio-v' + os.environ['STUDIO_VERSION']
          refs = subprocess.check_output(['git', 'ls-remote', '--tags', 'origin', tag, tag + '^{}'], text=True)
          targets = {line.split()[1]: line.split()[0] for line in refs.splitlines()}
          tagged = targets.get(tag + '^{}', targets.get(tag))
          if tagged and tagged != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing tag points at a different commit. Choose a new version.')
          result = subprocess.run(['gh', 'release', 'view', 'studio-v' + os.environ['STUDIO_VERSION'],
              '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'isDraft,targetCommitish'], capture_output=True, text=True)
          if result.returncode == 0:
              release = json.loads(result.stdout)
              if not release['isDraft'] or release['targetCommitish'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('This version is published or belongs to a different commit. Choose a new version.')
          PY

      - name: Reserve draft for verified platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "studio-v$STUDIO_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "studio-v$STUDIO_VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "NetBridge Studio $STUDIO_VERSION — candidate" \
              --notes "Build in progress. Each platform is attached only after its checks pass. Not hardware-qualified."

  build:
    permissions:
      contents: write
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
          - os: macos-15
            platform: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: app/netbridge-desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/netbridge-source/mesh/go.mod
          cache-dependency-path: app/netbridge-source/mesh/go.sum
      - name: Install build tools and stamp version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          python -m pip install pyinstaller==6.22.3 certifi -r app/netbridge-source/requirements-build.txt
          npm ci --prefix app/netbridge-desktop
          python app/netbridge-desktop/scripts/ci-release.py version --version "$STUDIO_VERSION"
          python - <<'PY'
          import os, pathlib, sys
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('NB_PYTHON=' + sys.executable + '\n')
              output.write('NB_MEDIA_DIR=' + str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'studio-runtime') + '\n')
          PY
      - name: Install GStreamer on macOS
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install gstreamer
      - name: Install GI Python for the persistent receiver on macOS
        if: runner.os == 'macOS' && inputs.persistent_audio
        run: |
          # PyInstaller must run under a Python that imports gi against this same Homebrew
          # GStreamer; the setup-python interpreter has no GI. pygobject3 installs gi for
          # Homebrew's own Pythons, and gstreamer installs its gi overrides only into
          # python@3.14 (the one setup-audio-dev.sh uses locally).
          brew install pygobject3
          base="$(brew --prefix python@3.14)/bin/python3.14"
          "$base" -m venv --system-site-packages "$RUNNER_TEMP/gi-python"
          gi_python="$RUNNER_TEMP/gi-python/bin/python"
          "$gi_python" -m pip install pyinstaller==6.22.3 certifi -r app/netbridge-source/requirements-build.txt
          "$gi_python" -c 'import gi; gi.require_version("Gst", "1.0"); from gi.repository import Gst; Gst.init(None); print(Gst.version_string()); print("webrtcdsp:", Gst.ElementFactory.find("webrtcdsp") is not None)'
          echo "NB_PYTHON=$gi_python" >> "$GITHUB_ENV"
      # Keyed by the pinned checksum, so a cached installer is the exact file verified below.
      - name: Restore verified GStreamer installer
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installer
          key: gstreamer-msvc-x86_64-1.26.11-31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605
      - name: Install verified GStreamer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GST_VERSION: '1.26.11'
          GST_SHA256: '31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605'
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'gstreamer-installer\gstreamer.msi'
          New-Item -ItemType Directory -Force -Path (Split-Path $msi) | Out-Null
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi"
          # gstreamer.freedesktop.org keeps ending this ~300 MB download early ("The response
          # ended prematurely"; 0.1.13 failed twice in a row), and starting over fails the same
          # way. curl resumes the partial file instead. The pinned checksum still decides trust.
          if (!(Test-Path $msi) -or (Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:GST_SHA256) {
            # Anything already here is not this run's partial download: never resume onto it.
            Remove-Item $msi -ErrorAction SilentlyContinue
            foreach ($attempt in 1..12) {
              curl.exe --fail --location --silent --show-error --continue-at - --output $msi $url
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 12) { throw "GStreamer download failed after $attempt attempts" }
              $size = if (Test-Path $msi) { (Get-Item $msi).Length } else { 0 }
              Write-Host "GStreamer download stopped (curl exit $LASTEXITCODE, $size bytes so far); resuming"
              Start-Sleep -Seconds 10
            }
          }
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:GST_SHA256) { throw 'GStreamer checksum mismatch' }
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
          if ($install.ExitCode -notin @(0, 3010)) { throw "GStreamer installation failed: $($install.ExitCode)" }
          $root = 'C:\gstreamer\1.0\msvc_x86_64'
          if (!(Test-Path "$root\bin\gst-launch-1.0.exe")) { throw 'GStreamer installation missing' }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - name: Find the Python that GStreamer's PyGObject was built for
        if: runner.os == 'Windows' && inputs.persistent_audio
        id: windows_gi
        shell: pwsh
        run: |
          # The MSI ships gi\_gi.cp3XY-win_amd64.pyd for ONE CPython version, not 3.11, and
          # PyGObject has no Windows wheels. Freeze the engine with exactly that version.
          $site = 'C:\gstreamer\1.0\msvc_x86_64\lib\site-packages'
          $pyd = Get-ChildItem -Path (Join-Path $site 'gi') -Filter '_gi.cp3*-win_amd64.pyd' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pyd) {
            Get-ChildItem -Path $site -Depth 1 -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw "No PyGObject extension under $site"
          }
          $minor = [regex]::Match($pyd.Name, '^_gi\.cp3(\d+)-').Groups[1].Value
          Write-Host "GStreamer PyGObject: $($pyd.Name) -> Python 3.$minor"
          "python=3.$minor" >> $env:GITHUB_OUTPUT
          "site=$site" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows' && inputs.persistent_audio
        id: windows_gi_python
        with:
          python-version: ${{ steps.windows_gi.outputs.python }}
          update-environment: false
      - name: Install GI Python for the persistent receiver on Windows
        if: runner.os == 'Windows' && inputs.persistent_audio
        env:
          BASE_PYTHON: ${{ steps.windows_gi_python.outputs.python-path }}
          GI_SITE: ${{ steps.windows_gi.outputs.site }}
        run: |
          "$BASE_PYTHON" -m venv "$RUNNER_TEMP/gi-python"
          gi_python="$RUNNER_TEMP/gi-python/Scripts/python.exe"
          "$gi_python" -m pip install pyinstaller==6.22.3 certifi -r app/netbridge-source/requirements-build.txt
          # Put GStreamer's own PyGObject/gst-python on this venv's path. Imported from its
          # install location, the MSI's patched gi finds C:\gstreamer\...\bin by itself; the
          # frozen engine gets PYGI_DLL_DIRS from scripts/pyi-rth-gi-dlls.py instead.
          "$gi_python" -c 'import os, site, pathlib; pathlib.Path(site.getsitepackages()[-1], "gstreamer-gi.pth").write_text(os.environ["GI_SITE"] + "\n")'
          "$gi_python" -c 'import gi; gi.require_version("Gst", "1.0"); from gi.repository import Gst; Gst.init(None); print(Gst.version_string()); print("webrtcdsp:", Gst.ElementFactory.find("webrtcdsp") is not None)'
          echo "NB_PYTHON=$gi_python" >> "$GITHUB_ENV"
      - name: Prepare and verify native media runtime
        run: python app/netbridge-desktop/scripts/prepare-runtime.py "$NB_MEDIA_DIR"
      - name: Test Studio
        working-directory: app/netbridge-desktop
        run: |
          npm test
          npx playwright install chromium
          npm run test:ui
          (cd src-tauri && cargo test --locked)
          python ../../tests/test-desktop-engine.py
          python ../../tests/test-bridge-health-refresh.py
          python ../../tests/test-studio-release.py
      - name: Configure macOS signing keychain
        if: runner.os == 'macOS' && inputs.macos_sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python app/netbridge-desktop/scripts/setup-apple-signing.py
      - name: Package Studio
        env:
          NB_UPDATE_ENDPOINT: ${{ inputs.updater && vars.STUDIO_UPDATE_ENDPOINT || '' }}
          NB_UPDATE_PUBLIC_KEY: ${{ inputs.updater && vars.STUDIO_UPDATE_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          WANT_UPDATER: ${{ inputs.updater }}
        run: |
          if [ "$WANT_UPDATER" = true ]; then
            test -n "$NB_UPDATE_ENDPOINT"
            test -n "$NB_UPDATE_PUBLIC_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
          fi
          npm run package --prefix app/netbridge-desktop -- --bundles '${{ matrix.bundles }}'
          python app/netbridge-desktop/scripts/smoke-engine.py app/netbridge-desktop/src-tauri/resources/NetBridgeEngine
      - name: Verify macOS bundle signature (including developer builds)
        if: runner.os == 'macOS'
        run: |
          app='app/netbridge-desktop/src-tauri/target/release/bundle/macos/NetBridge Studio.app'
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Verify macOS notarization
        if: runner.os == 'macOS' && inputs.macos_sign
        run: |
          app='app/netbridge-desktop/src-tauri/target/release/bundle/macos/NetBridge Studio.app'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Collect artifacts and checksums
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python app/netbridge-desktop/scripts/ci-release.py collect --version "$STUDIO_VERSION" \
            --platform "$RELEASE_PLATFORM" --directory app/netbridge-desktop/artifacts/release
      - name: Preserve verified platform in draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python app/netbridge-desktop/scripts/ci-release.py stage --version "$STUDIO_VERSION" \
            --directory app/netbridge-desktop/artifacts/release
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: studio-${{ matrix.platform }}-${{ github.run_id }}
          path: app/netbridge-desktop/artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Apple credentials
        if: always() && runner.os == 'macOS' && inputs.macos_sign
        run: |
          security delete-keychain "$RUNNER_TEMP/studio-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/studio-certificate.p12" "$RUNNER_TEMP/studio-notary.p8"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch verified platform drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "studio-v$STUDIO_VERSION" --repo "$GITHUB_REPOSITORY" --dir studio-release
      - name: Create release only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          python app/netbridge-desktop/scripts/ci-release.py publish --version "$STUDIO_VERSION" \
            --directory studio-release --draft "$RELEASE_DRAFT"
