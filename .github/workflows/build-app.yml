name: build presenter app

# Builds NetBridge Source for macOS and Windows and attaches both to a release.
#
# PyInstaller cannot cross-compile, so each binary must be produced on its own OS. Running
# this on GitHub's macos and windows runners is what makes a Windows build possible without
# owning a Windows machine.
#
# The artifacts are NOT code-signed — that needs a paid Apple account and an EV certificate.
# Recipients get one OS prompt on first run; see the README next to the app.

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: "bundle ffmpeg into the binary (bigger, but the user installs nothing)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Windows defaults to cp1252; the source contains UTF-8. Without this a
  # plain read_text() dies with UnicodeDecodeError partway through the build.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  build:
    needs: tests
    strategy:
      fail-fast: false          # a Windows failure must not hide a good macOS build
      matrix:
        include:
          - os: macos-latest
            asset: NetBridgeSource-macos-arm64
            bin: NetBridgeSource
          - os: windows-latest
            asset: NetBridgeSource-windows-x64
            bin: NetBridgeSource.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The embedded mesh client (J3 phase 5) is Go; build.py compiles it for this target.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi -r app/netbridge-source/requirements-build.txt

      # GStreamer is the ONLY return-audio player on Windows (ffmpeg has no audio output
      # device there), so it must be present on the runner for build.py to bundle it.
      # macOS copies from the runner's own Homebrew GStreamer, installed here too.
      # OFFICIAL GSTREAMER, PINNED AND CHECKSUM-VERIFIED.
      #
      # This used to be `choco install gstreamer`, which failed its own checksum upstream and
      # so failed every Windows build. The tempting fix -- --ignore-checksums -- was correctly
      # refused: GStreamer is the ONLY return-audio player on Windows, so a build that skipped
      # integrity verification would look fine and could have no room audio.
      #
      # The real fix is to stop using a third-party repackager. GStreamer publishes MSVC MSIs
      # and a .sha256sum for each one, so the checksum is verified against a value PINNED HERE:
      # verifying against a hash downloaded next to the file would only prove the mirror is
      # self-consistent, not that it is the artifact we tested.
      #
      # Runtime only. The devel MSI (352 MB) carries headers and import libraries we never use.
      # Everything the return pipeline needs -- core, udp, rtp/rtpmanager, opus, audioconvert,
      # audioresample, audiofx, volume, autodetect, wasapi -- is LGPL, and none of the
      # "restricted"/"ugly"/GPL codec packages are pulled in. That keeps redistribution simple.
      #   https://gstreamer.freedesktop.org/documentation/deploying/windows.html
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GST_VERSION: "1.26.11"
          GST_SHA256: "31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605"
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi"
          $msi = "$env:RUNNER_TEMP\gstreamer.msi"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          $got = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:GST_SHA256.ToLower()) {
            Write-Error "GStreamer MSI checksum MISMATCH`n  expected $($env:GST_SHA256)`n  got      $got`nRefusing to build: an unverified media stack means possibly-silent return audio."
            exit 1
          }
          Write-Host "sha256 verified: $got"
          # ADDLOCAL=ALL so the plugin set is complete; the bundler copies only what it needs.
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path "$root\bin\gst-launch-1.0.exe")) {
            Write-Error "GStreamer installed but gst-launch-1.0.exe is not at $root\bin"
            exit 1
          }
          Write-Host "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        run: brew install gstreamer || true

      - name: Build
        working-directory: app/netbridge-source
        run: python build.py ${{ (github.event.inputs.bundle_ffmpeg == 'false') && '--no-ffmpeg' || '' }}

      # Does the tree we are ABOUT TO SHIP contain everything the return pipeline needs?
      #
      # The smoke test below proves the app serves HTTP and reaches the fleet over TLS. Neither
      # touches GStreamer, so both would pass on a build whose return pipeline cannot be
      # constructed at all -- which is exactly what the Windows bundler produced while its
      # plugin allow-list was missing gstaudiofx (audiodynamic, used twice) and gstvolume.
      # Room audio silently absent, everything else apparently fine.
      #
      # This resolves every pipeline element against the BUNDLED plugin path with the system
      # path cleared, so it cannot pass by borrowing the runner's own GStreamer install.
      - name: Verify the bundled GStreamer can build the return pipeline
        working-directory: .
        run: python tools/verify-gst-bundle.py app/netbridge-source/_bundle/gst

      # Prove the binary at least starts and serves before publishing it. A build that
      # produces a file which crashes on launch is worse than a failed build: it looks
      # shippable. This does not need a camera — only the local HTTP server.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        working-directory: app/netbridge-source
        run: |
          ./dist/NetBridgeSource &
          up=0
          for i in $(seq 1 20); do
            curl -sf -m 2 http://127.0.0.1:8765/api/state >/dev/null && { up=1; break; }
            sleep 1
          done
          [ "$up" = 1 ] || { echo "app did not answer on :8765"; exit 1; }
          echo "app responds"
          # TLS regression check. A frozen build has no OS cert store, so every https call
          # to the fleet died CERTIFICATE_VERIFY_FAILED — the bridge list came back empty
          # and Go live did nothing. The old smoke test passed anyway, because the app was
          # answering locally the whole time. Signed out, this endpoint should 401; what it
          # must never do is fail to verify a certificate.
          body=$(curl -s -m 15 http://127.0.0.1:8765/api/bridges || true)
          case "$body" in
            *CERTIFICATE_VERIFY_FAILED*|*"unable to get local issuer"*)
              echo "TLS to the fleet is broken in the packaged app:"; echo "$body"; exit 1;;
          esac
          echo "fleet TLS ok"; exit 0

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: app/netbridge-source
        shell: pwsh
        run: |
          Start-Process -FilePath ".\dist\NetBridgeSource.exe"
          $up = $false
          for ($i=0; $i -lt 20; $i++) {
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:8765/api/state -TimeoutSec 2 -UseBasicParsing | Out-Null
              $up = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Write-Error "app did not answer on :8765"; exit 1 }
          Write-Host "app responds"
          # TLS regression check — see the macOS step for why this exists.
          $body = ""
          try {
            $body = (Invoke-WebRequest -Uri http://127.0.0.1:8765/api/bridges -TimeoutSec 15 -UseBasicParsing).Content
          } catch { $body = "$_" }
          if ($body -match "CERTIFICATE_VERIFY_FAILED" -or $body -match "unable to get local issuer") {
            Write-Error "TLS to the fleet is broken in the packaged app: $body"; exit 1
          }
          Write-Host "fleet TLS ok"; exit 0

      # Upload the app AND its mesh sidecar.
      #
      # This used to upload only ${{ matrix.bin }}. On macOS that ships a BROKEN app:
      # PyInstaller strips and re-signs any Mach-O it bundles, which corrupts the Go mesh
      # helper — tsnet's inbound UDP dies, so return audio is silently dead while everything
      # else looks healthy. build.py therefore also writes an unprocessed sidecar next to the
      # binary, and _mesh_bin() prefers it. Leaving the sidecar out of the artifact meant the
      # only working copies were the ones on the build machine.
      # Attach straight to the release. Artifact storage is only a staging area, and it has
      # now blocked this workflow twice on 2026-08-24 with "Artifact storage quota has been
      # hit" — a quota GitHub recalculates every 6-12 hours, so deleting old artifacts does
      # not unblock a build today. A binary that has been built, smoke-tested and TLS-checked
      # should not be discarded because a staging bucket is full.
      #
      # Each platform publishes itself, so one platform failing cannot withhold the other.
      # The release is created on first touch and appended to afterwards; --clobber makes a
      # re-run idempotent rather than a duplicate-asset error.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd app/netbridge-source/dist
          # Zip because a bare .exe or Mach-O download is often blocked by browsers and mail
          # filters, and zipping preserves the executable bit on macOS.
          # Name only what exists. app-pubkey.pem is written to dist/ ONLY when build.py is
          # given a signing key, which CI is not - the key that matters is already pinned
          # INSIDE the binary by --add-data, so its absence here is correct, not a gap. Naming
          # a missing file made zip warn on every run and would have hidden a real omission.
          # DO NOT use `[ -f name ]` to decide this on Windows.
          #
          # Git Bash resolves a bare executable name to its .exe, so `[ -f netbridge-mesh ]`
          # returns TRUE on a runner where only netbridge-mesh.exe exists. The release step
          # then asked python to package "netbridge-mesh", which genuinely does not exist, and
          # died. The shell test lied about a filename -- on macOS the same line is honest,
          # which is why this only ever failed on the platform that had never reached the step.
          #
          # python's os.path.isfile does no .exe resolution, so the selection happens there.
          # python's zipfile, NOT `zip`.
          #
          # GitHub's windows-latest image has no `zip` in Git Bash, so this step died with
          # "zip: command not found" the very first time a Windows build ever got this far.
          # It had never got this far before: the build used to fail earlier at GStreamer, so
          # fixing the build simply moved the failure one step later into code nobody had
          # exercised. A platform that never reaches a step cannot tell you the step is broken.
          #
          # One code path for both platforms, deliberately. This project has been bitten twice
          # by maintaining a second implementation for Windows -- the plugin allow-list that
          # drifted, and this. Python is already installed on both runners.
          #
          # The executable bit MUST survive: a macOS user who unzips a non-executable binary
          # gets "permission denied" with nothing explaining why.
          python - "${{ matrix.asset }}.zip" "${{ matrix.bin }}" <<'ZIPPY'
          import os, sys, zipfile
          out, required = sys.argv[1], sys.argv[2]
          # The main binary is REQUIRED. The rest travel only if they were actually produced:
          # app-pubkey.pem exists only when build.py is given a signing key, which CI is not,
          # and the mesh helper carries a platform-specific name.
          OPTIONAL = ("netbridge-mesh", "netbridge-mesh.exe", "app-pubkey.pem")
          names = [required] + [n for n in OPTIONAL if os.path.isfile(n)]
          # Say what we are looking at BEFORE failing on it. The first Windows attempt died
          # with a bare FileNotFoundError naming nothing useful, and each diagnostic round
          # trip through CI costs eight minutes.
          print("cwd:", os.getcwd())
          print("requested:", names)
          print("present:", sorted(os.listdir(".")))
          if not os.path.isfile(required):
              sys.exit("FATAL: the main binary %r was not produced by the build" % required)
          if len(names) < 2:
              sys.exit("FATAL: no mesh helper alongside %r. Shipping the app without it "
                       "produces a build where the room sees and hears the presenter and the "
                       "presenter hears nothing back." % required)
          with zipfile.ZipFile(os.path.join("../../..", out), "w", zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  zi = zipfile.ZipInfo.from_file(n, n)
                  mode = os.stat(n).st_mode
                  zi.external_attr = (mode & 0xFFFF) << 16      # keep the executable bit
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  with open(n, "rb") as fh, z.open(zi, "w") as w:
                      while True:
                          buf = fh.read(1 << 20)
                          if not buf:
                              break
                          w.write(buf)
          print("zipped %d file(s) -> %s" % (len(names), out))
          ZIPPY
          cd ../../..
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
              --title "NetBridge Source ${GITHUB_REF_NAME}" \
              --notes "Unsigned builds - see app/netbridge-source/README.md for the one-time OS prompt on each platform. Platforms are attached as their builds finish; if one is missing, its build failed and that binary does not exist for this version."
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset }}.zip" \
            --repo "${{ github.repository }}" --clobber

          # RELEASE MANIFEST — so provenance ships WITH the artifact.
          #
          # app-v1.2.0's macOS asset was a locally built binary that CI never tested, and
          # nothing on the release said so; it took hashing the file against a developer's
          # Desktop to discover it. A release that cannot say where it came from invites
          # exactly that.
          #
          # Everything here is derived from the run that produced the artifact -- none of it
          # is typed by a human, which is the property that makes it trustworthy.
          # shasum is absent from Git Bash on Windows too; python again, one path.
          SUM=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "${{ matrix.asset }}.zip")
          cat > "${{ matrix.asset }}.manifest.json" <<MANIFEST
          {
            "artifact":     "${{ matrix.asset }}.zip",
            "sha256":       "${SUM}",
            "version":      "${GITHUB_REF_NAME#app-v}",
            "git_sha":      "${{ github.sha }}",
            "git_ref":      "${GITHUB_REF_NAME}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "run_id":       "${{ github.run_id }}",
            "runner_os":    "${{ runner.os }}",
            "built_at":     "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by":     "github-actions",
            "signed":       false,
            "notarized":    false,
            "note": "Unsigned and un-notarized: no Apple Developer Program. A browser download is quarantined and must be cleared with: xattr -dr com.apple.quarantine ."
          }
          MANIFEST
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset }}.manifest.json" \
            --repo "${{ github.repository }}" --clobber
          echo "manifest: ${{ matrix.asset }}.zip sha256=${SUM} from ${{ github.sha }}"

