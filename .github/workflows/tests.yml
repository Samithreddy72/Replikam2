name: NetBridge release test gate
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  mesh-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/netbridge-source/mesh/go.mod
          cache-dependency-path: app/netbridge-source/mesh/go.sum
      - name: Test native mesh control boundary
        working-directory: app/netbridge-source/mesh
        run: go test -race ./...
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Python and media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools ffmpeg bc
          /usr/bin/python3 -m venv --system-site-packages .test-venv
          .test-venv/bin/pip install -r control-plane/backend/requirements.txt httpx==0.28.1 numpy==2.4.6 -r app/netbridge-source/requirements-build.txt
      - name: Run all Python and shell tests; skips block release
        env:
          NB_TEST_LOG_DIR: ${{ runner.temp }}/netbridge-test-logs
          FLEET_TEST_PY: ${{ github.workspace }}/.test-venv/bin/python
        run: bash tools/run-tests.sh --suite common --python .test-venv/bin/python --media-python .test-venv/bin/python
      - name: Validate production proxy configuration
        run: docker run --rm -e FLEET_DOMAIN=fleet.test -v "$PWD/control-plane/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check desktop interface
        working-directory: app/netbridge-desktop
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/fleet-workflow.spec.ts
      - name: Preserve individual test evidence
        # Test verdicts remain mandatory; storage exhaustion must not change them.
        # The same summaries and failed assertions remain in the run log.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbridge-test-evidence
          path: ${{ runner.temp }}/netbridge-test-logs
          retention-days: 7

  linux-media:
    # Noble explicitly disabled webrtcdsp in its package. Jammy still supplies
    # the actual element; no stub or accepted skip may satisfy this job.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          gst-inspect-1.0 webrtcdsp
          gst-inspect-1.0 webrtcechoprobe
          bash tools/run-tests.sh --suite linux-media
  macos-media:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install ffmpeg
      - run: bash tools/run-tests.sh --suite macos-media
