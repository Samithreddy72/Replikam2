name: build-image

# Builds a flashable, signed, SECRET-FREE NetBridge OS image (Journey 1 of the product
# walkthrough) in CI — replacing the manual factory/GOLDEN-IMAGE.md dd process.
# Trigger: push a tag `vX.Y.Z`, or run manually (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 2.0.1 (defaults to 2.0.0)'
        required: false
        default: ''

permissions:
  contents: write        # publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          # THE VERSION COMES FROM THE REPOSITORY, NOT FROM A TEXT BOX.
          #
          # This used to default to a hard-coded 2.0.0 with an optional dispatch input. Someone
          # typed 2.1 in July, later builds fell back to the default, and the result is a JULY
          # image on the releases page labelled 2.0.1 sitting above AUGUST images labelled
          # 2.0.0. The number carried no ordering information at all, and a person reaching for
          # "the newest" would have flashed the oldest.
          #
          # ./VERSION is reviewed like any other file, so changing it is a commit, not a
          # keystroke at dispatch time. A tag push takes its version from the tag. The dispatch
          # input survives only as a deliberate override for one-off builds.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            echo "::warning::version overridden at dispatch to $V (repository VERSION says $(cat VERSION))"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d ' \n\r' < VERSION)"
          fi
          [ -n "$V" ] || { echo "::error::no version could be determined"; exit 1; }
          # The identity is the SHA; the semantic part is a label for humans.
          echo "version=${V}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Raspberry Pi OS image
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 2500
          copy_repository_path: /opt/replikam2
          optimize_image: 'yes'
          commands: |
            IMAGE_VERSION="${{ steps.ver.outputs.version }}" REPLIKAM_REPO=/opt/replikam2 \
              BUILD_GIT_SHA="${{ github.sha }}" \
              BUILD_ID="${{ github.run_id }}" \
              BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              FLEET_CONTROL_URL="${{ vars.FLEET_CONTROL_URL }}" \
              FLEET_BOOTSTRAP_TOKEN="${{ secrets.FLEET_BOOTSTRAP_TOKEN }}" \
              bash /opt/replikam2/factory/ci-build-image.sh

      # From the arm-runner's single-partition image, derive BOTH fleet artifacts and
      # sign them: the OTA rootfs.tar.zst (bridge-update.sh) AND the flashable full-disk
      # A/B + /data image (factory/build-disk-image.sh). All logic lives in the script so
      # it can be tested off-CI against any raspios-style .img. Heavy work on /mnt (the
      # large ephemeral disk) so the ~8GB disk image + xz don't exhaust the root fs.
      - name: Assemble disk image + OTA rootfs, sign
        id: pkg
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dosfstools parted zstd xz-utils
          V="${{ steps.ver.outputs.version }}"
          sudo mkdir -p /mnt/work && sudo chmod 777 /mnt/work
          export TMPDIR=/mnt/work
          KEYARG=""
          if [ -n "${OTA_SIGNING_KEY:-}" ]; then
            printf '%s' "$OTA_SIGNING_KEY" > "$TMPDIR/ota-key.pem"
            KEYARG="--signing-key $TMPDIR/ota-key.pem"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OTA_SIGNING_KEY secret not set — publishing UNSIGNED. Add the repo secret to enable signing."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
          sudo TMPDIR=/mnt/work bash factory/ci-disk-from-image.sh \
            --image "${{ steps.build.outputs.image }}" \
            --version "$V" --outdir /mnt/work/out $KEYARG
          [ -f "$TMPDIR/ota-key.pem" ] && shred -u "$TMPDIR/ota-key.pem" || true
          sudo chown -R "$(id -u):$(id -g)" /mnt/work/out
          ls -la /mnt/work/out

      # A SUCCESSFUL BUILD MUST NEVER BE LOST TO A FAILED UPLOAD.
      #
      # On 2026-09-17 two consecutive builds of 84d4389 built and signed correctly, then lost
      # everything at publish: uploads.github.com returned "HTTP 500: Error saving asset" for
      # the ~1.1-1.3 GB files after ~40 minutes, and the image existed nowhere else. This keeps
      # the flashable set (image + signed manifest + pubkey) as a short-lived Actions artifact,
      # stored by a different service, so the image can still be downloaded, verified and
      # flashed. continue-on-error: an artifact-storage quota must not block a release.
      - name: Keep flashable image as a build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: netbridge-os-${{ steps.ver.outputs.version }}-flashable
          path: |
            /mnt/work/out/*.img.xz
            /mnt/work/out/manifest-disk.txt
            /mnt/work/out/manifest-disk.txt.sig
            /mnt/work/out/ota-pubkey.pem
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"
          cd /mnt/work/out
          # --repo is REQUIRED here: we cd'd out of the checkout, so gh can't infer the
          # repo from git (it errored "not a git repository" otherwise).
          # --target is NOT optional. Without it `gh release create` creates the tag at the
          # DEFAULT BRANCH'S CURRENT HEAD, not at the commit that was actually built -- and an
          # image build takes ~28 minutes, which is plenty of time for main to move.
          #
          # It already had: the release v2.0.0-1db20ec, the image running in production, has a
          # git tag pointing at b0b6366 -- one commit LATER than the 1db20ec its own name
          # records. Anyone tracing that release back through its tag lands on source the
          # artifact was never built from. The version string's SHA suffix was telling the
          # truth while the git tag quietly disagreed.
          # DRAFT FIRST, UPLOAD WITH RETRIES, PUBLISH LAST.
          # The old form was `gh release create … ./* || gh release upload … --clobber`. When an upload
          # failed, `create` deleted its own draft, so the fallback always ended in "release not found":
          # the retry could never succeed. Now the draft is created once (or reused on a re-run), each
          # file gets up to 3 time-limited attempts, and the release only becomes visible when every
          # asset is there — a half-uploaded release is never marked Latest.
          gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "v${V}" --repo "$REPO" --target "${{ github.sha }}" --draft \
            --title "NetBridge OS ${V} — FLASHABLE SD-card image (use the .img.xz)" \
            --notes "FLASH THIS: netbridge-os-${V}.img.xz — the full SD-card image. Raspberry Pi Imager → Choose OS → Use custom → pick that file. Change NO settings; the card configures itself. ⛔ DO NOT FLASH rootfs.tar.zst — it sits next to the image and is nearly the same size, but it is the over-the-air payload bridge-update.sh writes to a standby A/B slot on a RUNNING bridge; flashing it produces a dead card. Verify first: shasum -a 256 must match sha256= in manifest-disk.txt, and the byte size must match size= (a truncated download is the most common failure). Signature: openssl dgst -sha256 -verify ota-pubkey.pem -signature manifest-disk.txt.sig manifest-disk.txt. After flashing: boot, wait ~90s, join BridgeSetup-XXXX from a phone, give it the venue Wi-Fi, then Claim it on the fleet and set a PIN. ⚠️ Test-boot on a SPARE card first — a boot-layout bug in this this project history produced five un-bootable images. ⚠️ This image contains a fleet enrolment token; treat the file as confidential. Signed: ${{ steps.pkg.outputs.signed }}."
          for f in ./*; do
            for attempt in 1 2 3; do
              if timeout 1200 gh release upload "v${V}" --repo "$REPO" "$f" --clobber; then break; fi
              echo "::warning::upload of $f failed (attempt $attempt/3)"
              [ "$attempt" = 3 ] && { echo "::error::giving up on $f — the image is still in the build artifact"; exit 1; }
              sleep 60
            done
          done
          gh release edit "v${V}" --repo "$REPO" --draft=false --latest
