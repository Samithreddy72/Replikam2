name: build-image

# Builds a flashable, signed, SECRET-FREE NetBridge OS image (Journey 1 of the product
# walkthrough) in CI — replacing the manual factory/GOLDEN-IMAGE.md dd process.
# Trigger: push a tag `vX.Y.Z`, or run manually (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 2.0.1 (defaults to 2.0.0)'
        required: false
        default: ''

permissions:
  contents: write        # publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="2.0.0"; fi
          echo "version=${V}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # arm-runner emulates a Raspberry Pi OS arm64 rootfs and runs our provisioning
      # inside it (chroot + binfmt/qemu). The repo checkout is copied to /opt/replikam2.
      - name: Build Raspberry Pi OS image
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 2500
          copy_repository_path: /opt/replikam2
          optimize_image: 'yes'
          commands: |
            IMAGE_VERSION="${{ steps.ver.outputs.version }}" REPLIKAM_REPO=/opt/replikam2 \
              FLEET_CONTROL_URL="${{ vars.FLEET_CONTROL_URL }}" \
              FLEET_BOOTSTRAP_TOKEN="${{ secrets.FLEET_BOOTSTRAP_TOKEN }}" \
              bash /opt/replikam2/factory/ci-build-image.sh

      # From the arm-runner's single-partition image, derive BOTH fleet artifacts and
      # sign them: the OTA rootfs.tar.zst (bridge-update.sh) AND the flashable full-disk
      # A/B + /data image (factory/build-disk-image.sh). All logic lives in the script so
      # it can be tested off-CI against any raspios-style .img. Heavy work on /mnt (the
      # large ephemeral disk) so the ~8GB disk image + xz don't exhaust the root fs.
      - name: Assemble disk image + OTA rootfs, sign
        id: pkg
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dosfstools parted zstd xz-utils
          V="${{ steps.ver.outputs.version }}"
          sudo mkdir -p /mnt/work && sudo chmod 777 /mnt/work
          export TMPDIR=/mnt/work
          # Signing is REQUIRED, not best-effort. The walkthrough's J1 promise is "the same
          # SIGNED, secret-free image", and the bridge's own updater refuses an image whose
          # manifest it cannot verify (bridge-update.sh: "missing pubkey" / signature check).
          # Publishing unsigned therefore produced an artifact that looks like a release,
          # claims to be one, and cannot actually be installed by OTA — with only a warning
          # buried in the log. Fail loudly instead.
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set. A NetBridge image MUST be signed:"
            echo "::error::bridge-update.sh verifies the manifest signature before flashing, so an"
            echo "::error::unsigned image cannot be OTA-installed. Add the repo secret, or run"
            echo "::error::factory/ci-disk-from-image.sh locally if you deliberately want an unsigned build."
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > "$TMPDIR/ota-key.pem"
          KEYARG="--signing-key $TMPDIR/ota-key.pem"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          sudo TMPDIR=/mnt/work bash factory/ci-disk-from-image.sh \
            --image "${{ steps.build.outputs.image }}" \
            --version "$V" --outdir /mnt/work/out $KEYARG
          [ -f "$TMPDIR/ota-key.pem" ] && shred -u "$TMPDIR/ota-key.pem" || true
          sudo chown -R "$(id -u):$(id -g)" /mnt/work/out
          ls -la /mnt/work/out
          # Prove the signature actually exists and verifies BEFORE we publish it as a
          # release. "signed=yes" must never be a claim we did not check: a silent signing
          # failure would otherwise ship exactly the artifact this gate exists to prevent.
          cd /mnt/work/out
          for m in *.txt; do
            [ -e "$m" ] || continue
            [ -f "$m.sig" ] || { echo "::error::$m has no signature"; exit 1; }
            openssl dgst -sha256 -verify ota-pubkey.pem -signature "$m.sig" "$m" \
              || { echo "::error::$m signature does NOT verify against ota-pubkey.pem"; exit 1; }
          done
          echo "all manifests verified against the published pubkey"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"
          cd /mnt/work/out
          # --repo is REQUIRED here: we cd'd out of the checkout, so gh can't infer the
          # repo from git (it errored "not a git repository" otherwise).
          gh release create "v${V}" --repo "$REPO" \
            --title "netbridge-os ${V}" \
            --notes "Automated build. Signed: ${{ steps.pkg.outputs.signed }}. Assets: full-disk flashable image (netbridge-os-${V}.img.xz, A/B + /data + read-only root), OTA rootfs (rootfs.tar.zst for bridge-update.sh), signed manifests, and the OTA public key." \
            ./* \
          || gh release upload "v${V}" --repo "$REPO" ./* --clobber
